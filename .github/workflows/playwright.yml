name: Playwright mobile checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: pip install requests==2.34.2 beautifulsoup4==4.15.0 PyYAML==6.0.3 rapidfuzz==3.14.6 Pillow==12.3.0 PyMuPDF==1.28.2 playwright==1.63.0 cryptography==49.0.0
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Test collection and retention rules
        run: python -m unittest discover -s tests/unit -v
      - name: Check SEO and public JSON
        run: npm run seo:check
      - name: Run Playwright tests
        run: npm run test:e2e
