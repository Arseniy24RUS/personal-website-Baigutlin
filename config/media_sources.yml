media_monitoring:
  auto_publish_threshold: 0.75
  low_confidence_policy: persistent_review_queue
  # The preserved corpus ends in July 2024. Bootstrap must cover the gap since
  # that snapshot; 900 days includes an overlap before its latest publication.
  # Later runs keep the initial cutoff and resume the persisted discovery queue.
  initial_lookback_days: 900
  max_articles_per_run: 60
  max_runtime_seconds: 600
  # Reviewed historical mentions live in data/media/seed.json. Keep their
  # bilingual text, original IDs and local illustrations when refreshing.
  seed_urls: []
  listing_sources:
    - name: "ЧелГУ"
      name_en: "CSU"
      url: "https://www.csu.ru/press/news/"
      link_selector: '.post-card__link[href*="/press/news/"]'
      item_class: "post-card"
      date_selector: ".post-card-period"
      url_allow_regex: '^https://(?:www\.)?csu\.ru/press/news/[^/?#]+/?$'
  queries:
    - '"Байгутлин Данил"'
    - '"Данил Байгутлин"'
    - '"Байгутлин Данил Расулович"'
    - '"Байгутлин Д. Р."'
    - '"Danil Baigutlin"'
    - '"Danil R. Baigutlin"'
    - '"D. R. Baigutlin"'
    - '"Danil Baygutlin"'
  context_terms:
    - "челгу"
    - "челябинский государственный университет"
    - "физик"
    - "материаловед"
    - "конденсированного состояния"
    - "гейслер"
    - "спинтроник"
    - "магнитокалорическ"
    - "термоэлектрическ"
    - "chelyabinsk state university"
    - "physics"
    - "physicist"
    - "materials science"
    - "condensed matter"
    - "heusler"
    - "spintronic"
    - "magnetocaloric"
    - "thermoelectric"
  sitemap_sources:
    - name: "ЧелГУ"
      name_en: "CSU"
      sitemap_url: "https://www.csu.ru/sitemap.xml"
      url_allow_regex: '/press/news/[^/?#]+/?$'
      max_urls: 120
  site_scan_sources:
    - name: "ЧелГУ"
      name_en: "CSU"
      start_urls:
        - "https://www.csu.ru/search/?q=%D0%91%D0%B0%D0%B9%D0%B3%D1%83%D1%82%D0%BB%D0%B8%D0%BD"
        - "https://www.csu.ru/search/?q=%D0%91%D0%B0%D0%B9%D0%B3%D1%83%D1%82%D0%BB%D0%B8%D0%BD&PAGEN_1=2"
      url_allow_regex: '/press/news/[^/?#]+/?$'
      max_pages: 2
      max_depth: 0
  telegram_channels: []
